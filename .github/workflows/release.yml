name: Release

# Gated: the "Publish to npm" step only runs when the RELEASE_PUBLISH_ENABLED
# repo variable is set to "true" AND this isn't a workflow_dispatch dry run.
# RELEASE_PUBLISH_ENABLED is unset until the reveal decision, so the gate is
# closed by default. Publishing also requires registering this repo as an
# npm Trusted Publisher for the `@gismo/sdk` package (npm package settings >
# Publishing access) — see gismo-platform/docs/phase-7-supply-chain.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and sign, but skip the npm publish step"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # required for npm OIDC trusted publishing + provenance
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach Sigstore build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/**"

      # No stored npm token: --provenance authenticates via a short-lived,
      # workflow-scoped OIDC token exchanged at publish time, once the repo
      # is registered as a Trusted Publisher.
      - name: Publish to npm
        if: vars.RELEASE_PUBLISH_ENABLED == 'true' && github.event.inputs.dry_run != 'true'
        run: npm publish --provenance --access public
